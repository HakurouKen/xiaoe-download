name: 发布

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: 构建与验收
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: 确认从 main 分支触发
        env:
          RELEASE_REF: ${{ github.ref }}
        run: test "$RELEASE_REF" = refs/heads/main
      - name: 检出发布提交
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: 配置 pnpm
        uses: pnpm/action-setup@v4
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: 安装项目依赖
        run: pnpm install --frozen-lockfile
      - name: 读取发布标签
        id: version
        run: |
          jq -r '"tag=v" + .version' package.json >> "$GITHUB_OUTPUT"
      - name: 安装媒体工具
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: 运行核心检查与构建
        run: pnpm check
      - name: 运行核心 Linux 集成回归
        run: pnpm exec vitest run --config vitest.e2e.config.ts
      - name: 使用已有构建打包 Skill
        run: pnpm release
      - name: 验收最终 ZIP 与发布流程
        run: pnpm exec vitest run --config skills/xiaoe-download/tests/vitest.config.mjs
      - name: 保存已验收的发布附件
        uses: actions/upload-artifact@v4
        with:
          name: skill-release
          path: release/*
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: 跨平台冒烟测试（${{ matrix.os }}）
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出发布提交
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: 配置 pnpm
        uses: pnpm/action-setup@v4
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: 安装项目依赖
        run: pnpm install --frozen-lockfile
      - name: 下载已验收的发布附件
        uses: actions/download-artifact@v4
        with:
          name: skill-release
          path: release
      - name: 验证同一份 ZIP 安装包
        run: pnpm exec vitest run --config skills/xiaoe-download/tests/vitest.config.mjs skills/xiaoe-download/tests/package.e2e.mjs

  publish:
    name: 发布版本
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: 检出发布提交
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: 下载已验收的发布附件
        uses: actions/download-artifact@v4
        with:
          name: skill-release
          path: release
      - name: 校验已验收的发布附件
        working-directory: release
        run: |
          archive="xiaoe-download-skill-${RELEASE_TAG}.zip"
          test -s "$archive"
          test -s "$archive.sha256"
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 2
          printf '%s  %s\n' "$(sha256sum "$archive" | cut -d ' ' -f 1)" "$archive" > expected.sha256
          cmp expected.sha256 "$archive.sha256"
          rm expected.sha256
      - name: 创建标签并发布已验收的版本
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

          # 查询包含草稿的版本列表；API 失败不能视为版本不存在。
          state=$(gh api --paginate "repos/$GH_REPO/releases" \
            --jq '.[] | select(.tag_name == env.RELEASE_TAG) | .draft')
          if [ -n "$state" ] && [ "$state" != true ]; then
            echo "版本已正式发布或状态异常，请使用新版本号" >&2
            exit 1
          fi

          remote_tag=$(git ls-remote --refs origin "refs/tags/$RELEASE_TAG")
          if [ -n "$remote_tag" ]; then
            git fetch origin "refs/tags/$RELEASE_TAG"
            test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$RELEASE_SHA"
          else
            git tag "$RELEASE_TAG" "$RELEASE_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

          if [ -z "$state" ]; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --target "$RELEASE_SHA" --title "$RELEASE_TAG" --generate-notes
          fi
          archive="release/xiaoe-download-skill-${RELEASE_TAG}.zip"
          gh release upload "$RELEASE_TAG" "$archive" "$archive.sha256" --clobber

          # 正式发布前，下载并逐字节核对已上传的附件。
          verify_dir=$(mktemp -d)
          trap 'rm -rf "$verify_dir"' EXIT
          gh release download "$RELEASE_TAG" --dir "$verify_dir" \
            --pattern "xiaoe-download-skill-${RELEASE_TAG}.zip*"
          cmp "$archive" "$verify_dir/$(basename "$archive")"
          cmp "$archive.sha256" "$verify_dir/$(basename "$archive").sha256"
          gh release edit "$RELEASE_TAG" --draft=false
