name: Release Skill

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-skill-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm check
      - name: Core Linux regression
        run: pnpm exec vitest run --config vitest.e2e.config.ts
      - name: Package Skill without rebuilding
        run: pnpm release
      - name: Skill and release regression against final ZIP
        run: pnpm exec vitest run --config skills/xiaoe-download/tests/vitest.config.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: skill-release
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: skill-release
          path: dist/release
      - name: Test the same ZIP without rebuilding
        run: pnpm exec vitest run --config skills/xiaoe-download/tests/vitest.config.mjs skills/xiaoe-download/tests/package.e2e.mjs

  draft-release:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: skill-release
          path: dist/release
      - run: pnpm release --upload
